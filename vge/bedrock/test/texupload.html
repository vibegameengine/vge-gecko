<!doctype html>
<html>
<body style="margin:0">
  <canvas id="c" width="1264" height="770"></canvas>
  <script>
    const params = new URLSearchParams(location.search);
    const mode = params.get("mode") || "float";
    const canvasElement = document.getElementById("c");
    if (params.get("css")) {
      canvasElement.style.cssText = "position:fixed;left:0;top:0;width:100vw;height:100vh;display:block";
    }
    if (params.get("overlay")) {
      const overlay = document.createElement("div");
      overlay.style.cssText = "position:fixed;left:40px;top:40px;width:400px;height:300px;background:rgba(200,120,60,.8);backdrop-filter:blur(4px);border-radius:24px;box-shadow:0 8px 40px #0008";
      document.body.appendChild(overlay);
    }
    const gl = document.getElementById("c").getContext("webgl2", {
      alpha: true, depth: true, stencil: false, antialias: true, premultipliedAlpha: true,
      preserveDrawingBuffer: false, powerPreference: "high-performance", failIfMajorPerformanceCaveat: false,
    });
    const compile = (type, source) => {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      return shader;
    };
    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, "#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0,1);}"));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, "#version 300 es\nprecision highp float;uniform highp sampler2D t;out vec4 c;void main(){c=texture(t,gl_FragCoord.xy/512.)+vec4(.2);}"));
    gl.linkProgram(program);
    gl.useProgram(program);
    if (params.get("colorspace")) {
      gl.drawingBufferColorSpace = "srgb";
      gl.unpackColorSpace = "srgb";
    }
    gl.getExtension("EXT_color_buffer_float");
    const size = 512;
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    const isFloat = mode.startsWith("float");
    gl.texStorage2D(gl.TEXTURE_2D, 1, isFloat ? gl.RGBA32F : gl.RGBA8, size, size);
    const pixels = isFloat ? new Float32Array(size * size * 4) : new Uint8Array(size * size * 4);
    const frame = () => {
      for (let i = 0; i < 3; i++) {
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, size, size, gl.RGBA, isFloat ? gl.FLOAT : gl.UNSIGNED_BYTE, pixels);
      }
      gl.clearColor(0.2, 0.2, 0.2, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  </script>
</body>
</html>
